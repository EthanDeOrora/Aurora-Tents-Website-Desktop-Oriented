<!DOCTYPE html>
<html lang="en">
  <head>
        <meta charset="UTF-8">
        <meta name="description" content="Aurora Tents and Services provides high-quality tents and equipment for all your outdoor needs.">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Get Your Quote!</title>
        <link rel="stylesheet" href="request-quote.css" type="text/css">
        <link href='https://fonts.googleapis.com/css?family=Adamina' rel='stylesheet'>
        <link href='https://fonts.googleapis.com/css?family=Arima' rel='stylesheet'>
        <link href='https://fonts.googleapis.com/css?family=Aboreto' rel='stylesheet'>
        <script src="script.js" defer></script>
        <link href='https://fonts.googleapis.com/css?family=Alan Sans' rel='stylesheet'>
        <link href='https://fonts.googleapis.com/css?family=Bitcount Grid Single' rel='stylesheet'>
        <link href='https://fonts.googleapis.com/css?family=Abyssinica SIL' rel='stylesheet'>
        <link href='https://fonts.googleapis.com/css?family=Cinzel Decorative' rel='stylesheet'>
        <link href='https://fonts.googleapis.com/css?family=Aclonica' rel='stylesheet'>
        <link href='https://fonts.googleapis.com/css?family=Cabin Sketch' rel='stylesheet'>
        <link href='https://fonts.googleapis.com/css?family=Architects Daughter' rel='stylesheet'>
        <link rel="icon" type="image/x-icon" href="favicon.png" class="iconb">
  </head>
  <body>
        <button id="back-button" class="reveal" onclick="history.back()">← Go Back</button>

        <div class="split-container">

            <!-- LEFT PANEL -->
              
            <div class="left-panel">
            <img src="quote-gif.gif" alt="Aurora Tents Animation" class="hero-gif"/>
            </div>

            <!-- RIGHT PANEL -->
            <div class="right-panel">
            <div class="form-wrapper">
                <div class="form-card">
                    <form id="quote-form" class="right-form">
                        <fieldset id="sign up" class="reveal">
                        <legend class="reveal">Inquire for Services Today</legend>
                        <label class="reveal">Name: <input type="text" name="Name" placeholder="Jane Doe" maxlength="20" required></label><br><br>
                        <label class="reveal"> Email: <input type="email" placeholder="myemail@example.com" aria-label="Email in format example@domain.com" name="Email" maxlength="30" required></label><br><br>
                        <label class="reveal">Phone: <input type="tel" name="Phone number" pattern="[0-9]{3}[0-9]{3}[0-9]{4}" placeholder="1234567890" aria-label="Phone number in format 123-456-7890" required>
                            <select class="reveal" name="Country code" class="codes">
                            <option class="reveal" value="Kenya">+254 Kenya</option>
                            <option class="reveal" value="Australia">+61 Australia</option>
                            <option class="reveal" value="Brazil">+5 Brazil</option>
                            <option class="reveal" value="Canada">+1 Canada</option>
                            <option class="reveal" value="Great Britain">+44 Great Britain</option>
                            <option class="reveal" value="Japan">+81 Japan</option> 
                            <option class="reveal" value="Russia">+7 Russia</option>
                            <option class="reveal" value="U.S.A.">+1 U.S.A.</option>
                        </select><br><br></label>
                        <label class="reveal"> Number of Chairs: <input type="number" name="Number of chairs" min="0" max="5000" placeholder="0" required></label><br><br>
                        <label class="reveal"> Number of Tables: <input type="number" name="Number of tables" min="0" max="1000" placeholder="0" required></label><br><br>
                        <label class="reveal"> Type of Tent Needed:
                            <select class="reveal" name="Type of tent" required>
                                <option class="reveal" value="Select tent type">--Select tent type--</option>
                                <option class="reveal" value="Frame Tent">Frame Tent</option>
                                <option class="reveal" value="Pole Tent">Pole Tent</option>
                                <option class="reveal" value="Clear Span Tent">Clear Span Tent</option>
                                <option class="reveal" value="Marquee Tent">Marquee Tent</option>
                                <option class="reveal" value="Canopy Tent">Canopy Tent</option>
                            </select>
                        </label><br><br>
                        <label class="reveal">Select your title:</label><br>
                        <input class="reveal" type="radio"name="Title" value="Miss">Miss
                        <input class="reveal" type="radio"name="Title" value="Mrs.">Mrs.
                        <input class="reveal" type="radio"name="Title" value="Ms.">Ms.
                        <input class="reveal" type="radio"name="Title" value="Mr.">Mr.
                        <input class="reveal" type="radio"name="Title" value="Dr.">Dr.
                        <input class="reveal" type="radio"name="Title" value="Prof.">Prof.            
                        <p class="reveal" id="formality"><em>*We respect formality. Please select the title that suits you the most*</em></p>
                        <label class="reveal">When do you require them?     <input type="date" name="Date required" placeholder="Select a date"><br><br></label>
                        <textarea class="reveal" name="Additional details/instructions" rows="5" cols="50" placeholder="Please share any additional details about your event or request (e.g. setup needs or special instructions)."></textarea><br><br>
                        <button type="submit" class="reveal" id="submit-button">Submit</button>
                        </fieldset>
                </form>
                </div>
            </div>
            </div>
        </div>

        <script>
                    window.addEventListener("load", () => {
                    document.body.classList.add("loaded");
                    });
                </script>

                <script>
                    const observer = new IntersectionObserver(entries => {
                        entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add("active");
                        }
                        });
                    });

                    document.querySelectorAll(".reveal").forEach(el => observer.observe(el));
                    </script>
                    <script>
                    document.querySelectorAll("a").forEach(link => {
                        link.addEventListener("click", e => {
                        if (link.href.includes(window.location.origin)) {
                            e.preventDefault();
                            document.body.classList.add("fade-out");
                            setTimeout(() => {
                            window.location = link.href;
                            }, 200);
                        }
                        });
                    });
                </script>
  </body>
</html>
