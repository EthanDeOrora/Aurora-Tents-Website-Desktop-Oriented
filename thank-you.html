<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="description" content="Aurora Tents and Services provides high-quality tents and equipment for all your outdoor needs.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success! | Aurora Tents and Services</title>
    <link rel="stylesheet" href="thank-you.css" type="text/css">
    <link href='https://fonts.googleapis.com/css?family=Adamina' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Arima' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Aboreto' rel='stylesheet'>
    <script src="script.js"></script>
    <link href='https://fonts.googleapis.com/css?family=Alan Sans' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Bitcount Grid Single' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Abyssinica SIL' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Cinzel Decorative' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Aclonica' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Cabin Sketch' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Architects Daughter' rel='stylesheet'>
    <link rel="icon" type="image/x-icon" href="favicon.png" class="iconb">
  </head>
<body>

  <button id="back-button" class="reveal" onclick="window.location.href='home.html'">← Back to Home</button><br><br>

  <!-- Centered content -->
  <div class="thank-you-container">
    <img src="sent-gif.gif" alt="Sent Gif` Animation" class="thank-you-gif">
    <h1>Thank you!</h1>
    <p>Your request has been received. We’ll contact you shortly.</p>
  </div>

  <section id="info-section" class="reveal">
      <h2 id="section-title" class="reveal">Choose Your Next Step</h2>
      <div id="info-grid" class="reveal">
        <a href="request-quote.html" class="contact-links"><div id="info-card" class="reveal">
          <img src="quote.gif" alt="Request Quote Icon" class="reveal" id="info-icon">
          <h3 id="info-title" class="reveal">Request For a Quote On Rentals</h3>
        </div></a>
        <a href="packages.html" class="contact-links"><div id="info-card" class="reveal">
          <img src="package.gif" alt="Checkout Our Packages Icon" class="reveal" id="info-icon">
          <h3 id="info-title" class="reveal">Check Out Our Rental Packages</h3>
        </div></a>

        <a href="feedback.html" class="contact-links"><div id="info-card" class="reveal">
          <img src="feedback.gif" alt="Share Feedback Icon" class="reveal" id="info-icon">
          <h3 id="info-title" class="reveal">Share Your Feedback and Experience</h3>
        </div></a>
        <a href="about.html" class="contact-links"><div id="info-card" class="reveal">
          <img src="about.gif" alt="About Us Icon" class="reveal" id="info-icon">
          <h3 id="info-title" class="reveal">Learn About Aurora Tents and Services</h3>
        </div></a>
      </div>
    </section>

    <script>
      window.addEventListener("load", () => {
      document.body.classList.add("loaded");
      });
    </script>

    <script>
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("active");
          }
        });
      });

      document.querySelectorAll(".reveal").forEach(el => observer.observe(el));
    </script>
    <script>
      document.querySelectorAll("a").forEach(link => {
        link.addEventListener("click", e => {
          if (link.href.includes(window.location.origin)) {
            e.preventDefault();
            document.body.classList.add("fade-out");
            setTimeout(() => {
              window.location = link.href;
            }, 200);
          }
        });
      });
    </script>

  </body>
</html>
